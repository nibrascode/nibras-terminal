name: Launch test

on:
  push:
    branches: [main, "wip/**"]
    paths-ignore: ["**.md", "catalog/**", "linux-engine/**", "web/**", "src/**"]
  workflow_dispatch:

jobs:
  launch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 31, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator (x86_64 with ARM translation) and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash scripts/launch-test.sh app/build/outputs/apk/debug/app-debug.apk launch-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-test-api${{ matrix.api }}
          path: launch-test/
