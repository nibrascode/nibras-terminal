name: Android package

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "catalog/**", "linux-engine/**", ".github/workflows/proot-test.yml"]
  workflow_dispatch:
    inputs:
      sdk:
        description: Android SDK
        required: false
        default: "35"
        type: choice
        options:
          - "35"
          - "34"
          - "33"
      kind:
        description: apk, aab, or sign
        required: false
        default: apk
        type: choice
        options:
          - apk
          - aab
          - sign

run-name: ${{ inputs.kind || 'apk' }} ${{ inputs.sdk || '35' }}

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      SDK: ${{ github.event.inputs.sdk || '35' }}
      KIND: ${{ github.event.inputs.kind || 'apk' }}
      NIBRAS_KEYSTORE_B64: ${{ secrets.NIBRAS_KEYSTORE_B64 }}
      NIBRAS_STORE_PASSWORD: ${{ secrets.NIBRAS_STORE_PASSWORD }}
      NIBRAS_KEY_PASSWORD: ${{ secrets.NIBRAS_KEY_PASSWORD }}
      NIBRAS_KEY_ALIAS: ${{ secrets.NIBRAS_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: ${{ github.event.inputs.sdk == '33' && 'platform-tools platforms;android-33 build-tools;33.0.2' || github.event.inputs.sdk == '34' && 'platform-tools platforms;android-34 build-tools;34.0.0' || 'platform-tools platforms;android-35 build-tools;35.0.0' }}
      - name: Pin lower SDK
        run: |
          python3 << 'PY'
          import os
          sdk = os.environ.get("SDK") or "35"
          root = open("build.gradle.kts").read()
          app = open("app/build.gradle.kts").read()
          if sdk == "34":
              root = root.replace('version "8.7.3"', 'version "8.5.2"', 1)
              app = app.replace("compose-bom:2024.10.01", "compose-bom:2024.06.00")
              app = app.replace("activity-compose:1.9.3", "activity-compose:1.9.0")
          elif sdk == "33":
              root = root.replace('version "8.7.3"', 'version "8.2.2"', 1)
              app = app.replace("compose-bom:2024.10.01", "compose-bom:2024.01.00")
              app = app.replace("activity-compose:1.9.3", "activity-compose:1.7.2")
              app = app.replace("core-ktx:1.13.1", "core-ktx:1.12.0")
              app = app.replace("lifecycle-runtime-compose:2.8.7", "lifecycle-runtime-compose:2.7.0")
              app = app.replace("lifecycle-viewmodel-compose:2.8.7", "lifecycle-viewmodel-compose:2.7.0")
          open("build.gradle.kts", "w").write(root)
          open("app/build.gradle.kts", "w").write(app)
          PY
      - name: Release key
        if: env.KIND == 'sign'
        run: |
          python3 << 'PY'
          import base64, os, pathlib
          raw = os.environ.get("NIBRAS_KEYSTORE_B64") or ""
          store = os.environ.get("NIBRAS_STORE_PASSWORD") or ""
          key = os.environ.get("NIBRAS_KEY_PASSWORD") or ""
          alias = os.environ.get("NIBRAS_KEY_ALIAS") or "nibras"
          if not raw or not store or not key:
              raise SystemExit("Release key is missing")
          path = pathlib.Path("nibras-release.jks")
          path.write_bytes(base64.b64decode(raw))
          env = pathlib.Path("nibras-signing.env")
          env.write_text(
              "NIBRAS_STORE_FILE=%s\nNIBRAS_STORE_PASSWORD=%s\nNIBRAS_KEY_ALIAS=%s\nNIBRAS_KEY_PASSWORD=%s\n"
              % (path.resolve(), store, alias, key)
          )
          env.chmod(0o600)
          PY
      - name: Build
        run: |
          CODE=$((100 + ${GITHUB_RUN_NUMBER:-0}))
          GRADLE=(./gradlew --no-daemon -Psdk="$SDK" -PversionCode="$CODE" -PversionName="0.2.$CODE")
          if [ "$KIND" = "sign" ]; then
            set -a
            . ./nibras-signing.env
            set +a
            "${GRADLE[@]}" assembleRelease bundleRelease
          elif [ "$KIND" = "aab" ]; then
            "${GRADLE[@]}" bundleDebug
          else
            "${GRADLE[@]}" assembleDebug
          fi
          mkdir -p dist
          printf '%s\n' "$CODE" > dist/version.txt
          if [ "$KIND" = "sign" ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/
            cp app/build/outputs/bundle/release/app-release.aab dist/
          elif [ "$KIND" = "aab" ]; then
            cp app/build/outputs/bundle/debug/app-debug.aab dist/
          else
            cp app/build/outputs/apk/debug/app-debug.apk dist/
          fi
      - name: Unit tests (rootfs extractor)
        run: ./gradlew --no-daemon -Psdk="$SDK" testDebugUnitTest
      - name: Check ABIs
        if: env.KIND != 'aab'
        run: |
          APK=$(ls dist/*.apk | head -1)
          unzip -l "$APK" | grep -E 'lib/|assets/payloads/' | tee dist/apk-contents.txt
          for abi in arm64-v8a armeabi-v7a; do
            for lib in libproot.so libproot-loader.so libtalloc.so libtermux.so; do
              unzip -l "$APK" | grep -q "lib/$abi/$lib" || { echo "missing lib/$abi/$lib"; exit 1; }
            done
          done
          ls -l "$APK" | tee -a dist/apk-contents.txt
      - name: Check signature
        run: |
          TOOL=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort | tail -1)
          if [ "$KIND" = "sign" ]; then
            "$TOOL" verify dist/app-release.apk
            jarsigner -verify dist/app-release.aab
          elif [ "$KIND" = "aab" ]; then
            jarsigner -verify dist/app-debug.aab
          else
            "$TOOL" verify dist/app-debug.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nibras-${{ github.event.inputs.kind || 'apk' }}-${{ github.event.inputs.sdk || '35' }}
          path: dist/
