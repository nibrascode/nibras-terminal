name: Android build test

# On-phone app building (Android Code Studio parity): runs nibras-apk inside an arm64 Debian
# container exactly as the guest does — JDK 17, Android SDK with phone-native aapt2, Gradle 8.11,
# project templates — and checks that the built APK is valid.
on:
  workflow_dispatch:
  push:
    branches: [main, "wip/**"]
    paths:
      - "app/src/main/assets/guest/nibras-apk"
      - ".github/workflows/android-build-test.yml"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        template: [views, kotlin, webview, list, form]
    name: template ${{ matrix.template }}
    steps:
      - uses: actions/checkout@v4
      - name: Build an app with nibras-apk (arm64 Debian)
        run: |
          mkdir -p t && cp app/src/main/assets/guest/nibras-apk app/src/main/assets/guest/nibras-need app/src/main/assets/guest/nibras-msg.sh t/
          cat > t/run.sh <<'SH'
          set -e
          apt-get update -qq && apt-get install -y -qq curl unzip zip ca-certificates git >/dev/null
          install -m755 /t/nibras-apk /usr/local/bin/nibras-apk; install -m755 /t/nibras-need /usr/local/bin/nibras-need
          mkdir -p /usr/local/share/nibras /root/.nibras; cp /t/nibras-msg.sh /usr/local/share/nibras/msg.sh
          yes | nibras-apk setup --sdk
          nibras-apk new /root/demo com.nibras.demo --template "$1"
          ls /root/demo
          nibras-apk build /root/demo
          apk=$(find /root/demo -path '*/build/outputs/apk/*' -name '*.apk' | head -1)
          test -n "$apk"
          /opt/android-sdk/build-tools/35.0.0/aapt2 dump badging "$apk" | head -3
          java -jar /opt/android-sdk/build-tools/35.0.0/lib/apksigner.jar verify "$apk" && echo "ANDROID_BUILD_OK $(du -h "$apk" | cut -f1)"
          nibras-apk activity Extra /root/demo
          nibras-apk class Box /root/demo
          nibras-apk screen button home /root/demo
          nibras-apk dep androidx.recyclerview:recyclerview:1.4.0 /root/demo
          test -f /root/demo/app/src/main/res/layout/activity_extra.xml
          test -f /root/demo/app/src/main/res/layout/activity_home.xml
          grep -q recyclerview /root/demo/app/build.gradle
          if [ "$1" = kotlin ]; then test -f /root/demo/app/src/main/java/com/nibras/demo/ExtraActivity.kt
          else test -f /root/demo/app/src/main/java/com/nibras/demo/ExtraActivity.java; fi
          echo STUDIO_OK
          if [ "$1" = views ]; then # APK tools (APK Editor / MT Manager / APKTool M parity) on the built app
            cp "$apk" /root/app.apk; cd /root
            nibras-apk decompile app.apk app-src && sed -i 's/Built with Nibras Terminal/Modded/' app-src/res/layout/activity_main.xml
            echo n | nibras-apk rebuild app-src && nibras-apk sigcheck app-src-mod.apk
            nibras-apk optimize app.apk && test -f app-opt.apk
            nibras-apk baksmali app.apk smali-out && nibras-apk smali smali-out classes2.dex && test -s classes2.dex
            nibras-apk rename app.apk com.nibras.democlone "Demo Clone" && /opt/android-sdk/build-tools/35.0.0/aapt2 dump badging app-com.nibras.democlone.apk | grep -q "package: name='com.nibras.democlone'"
            mkdir split && cp app.apk split/base.apk && (cd split && zip -q ../app.apks base.apk) && nibras-apk merge app.apks && test -f app-merged.apk
            nibras-apk diff app.apk app-src-mod.apk --full | grep -q Modded
            nibras-apk analyze app.apk | grep -q dex
            nibras-apk perms app-src +android.permission.VIBRATE
            grep -q android.permission.VIBRATE app-src/AndroidManifest.xml
            nibras-apk perms app-src -android.permission.VIBRATE
            echo APK_TOOLS_OK
          fi
          SH
          docker run --rm -v "$PWD/t:/t" arm64v8/debian:bookworm sh /t/run.sh ${{ matrix.template }} 2>&1 | tee build.log
          grep -q ANDROID_BUILD_OK build.log
          [ "${{ matrix.template }}" != views ] || grep -q APK_TOOLS_OK build.log
