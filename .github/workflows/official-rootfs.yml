name: Official rootfs

on:
  workflow_dispatch:

jobs:
  debian-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Debian stable arm64 from the official image
        run: |
          mkdir -p rootfs
          docker buildx build --platform linux/arm64 -f - -o type=local,dest=./rootfs . <<'EOF'
          FROM debian:stable-slim
          EOF
          tar -C rootfs -cJf debian-arm64-minbase.tar.xz .
          sha256sum debian-arm64-minbase.tar.xz | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: debian-arm64-minbase
          path: |
            debian-arm64-minbase.tar.xz
            SHA256SUMS
